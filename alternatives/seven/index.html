<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akhil Acharya</title>
  <meta name="description" content="Akhil Acharya">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      overflow: hidden;
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
      transition: background 0.4s;
    }
    body[data-theme="dark"]  { background: #08090c; --fg: #f2f2ee; --dim: #6b6f78; }
    body[data-theme="light"] { background: #f4f1e8; --fg: #17140e; --dim: #98917f; }

    #stage { position: fixed; inset: 0; touch-action: none; }

    /* ---- shared profile links (every day) ---- */
    .links {
      position: fixed;
      right: 1.2rem;
      bottom: 1.1rem;
      z-index: 20;
      display: flex;
      gap: 1.3rem;
      font-size: 0.7rem;
      letter-spacing: 0.09em;
    }
    .links a {
      color: var(--dim);
      text-decoration: none;
      padding: 0.4rem 0.1rem;
      transition: color 0.25s;
      -webkit-tap-highlight-color: transparent;
    }
    .links a:hover, .links a:active { color: var(--fg); }

    /* ---- day switcher: quiet rail on the left, reveals on hover ---- */
    .rail {
      position: fixed;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      padding: 0.5rem 0.7rem;
    }
    .rail a {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      text-decoration: none;
      color: var(--dim);
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 0.26rem 0.1rem;
      transition: color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .rail a i {
      display: block;
      width: 13px;
      height: 1px;
      background: currentColor;
      opacity: 0.5;
      transition: width 0.2s ease, opacity 0.2s;
    }
    .rail a span {
      opacity: 0;
      transform: translateX(-4px);
      transition: opacity 0.2s, transform 0.2s;
    }
    .rail:hover a span, .rail:focus-within a span { opacity: 0.7; transform: none; }
    .rail a:hover { color: var(--fg); }
    .rail a.current { color: var(--fg); }
    .rail a.current i { width: 22px; opacity: 1; }
    .rail a.current span { opacity: 1; transform: none; }

    @media (max-width: 640px) {
      /* collapse to a row of dots along the bottom */
      .rail {
        left: 50%;
        top: auto;
        bottom: 1.05rem;
        transform: translateX(-50%);
        flex-direction: row;
        gap: 0.55rem;
        padding: 0.4rem;
      }
      .rail a { padding: 0.4rem 0.15rem; }
      .rail a span { display: none; }
      .rail a i { width: 5px; height: 5px; border-radius: 50%; opacity: 0.45; }
      .rail a.current i { width: 7px; height: 7px; opacity: 1; }
      .links { bottom: 1.05rem; right: 1rem; gap: 1rem; }
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
  </style>
</head>
<body data-theme="dark">
  <div id="stage"></div>
  <h1 class="sr-only">Akhil Acharya</h1>

  <nav class="rail" aria-label="Day of the week">
    <a href="?day=0" data-day="0"><i></i><span>Sun</span></a>
    <a href="?day=1" data-day="1"><i></i><span>Mon</span></a>
    <a href="?day=2" data-day="2"><i></i><span>Tue</span></a>
    <a href="?day=3" data-day="3"><i></i><span>Wed</span></a>
    <a href="?day=4" data-day="4"><i></i><span>Thu</span></a>
    <a href="?day=5" data-day="5"><i></i><span>Fri</span></a>
    <a href="?day=6" data-day="6"><i></i><span>Sat</span></a>
  </nav>

  <nav class="links" aria-label="Profiles">
    <a href="https://github.com/akhilcacharya" target="_blank" rel="noopener">github ↗</a>
    <a href="https://www.linkedin.com/in/akhil-acharya/" target="_blank" rel="noopener">linkedin ↗</a>
  </nav>

  <script type="module">
    // One piece per day of the week, keyed to Eastern Time (Cambridge, MA).
    const days = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
    const q = new URLSearchParams(location.search);

    let idx;
    if (q.has('day')) {
      idx = (((parseInt(q.get('day'), 10) || 0) % 7) + 7) % 7;
    } else {
      try {
        const wd = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short' })
          .format(new Date()).toLowerCase().slice(0, 3);
        idx = Math.max(0, days.indexOf(wd));
      } catch {
        idx = new Date().getDay();
      }
    }

    // mark the active day in the rail
    const railItem = document.querySelector(`.rail a[data-day="${idx}"]`);
    if (railItem) railItem.classList.add('current');

    import(`./days/${days[idx]}.js`).then(m => m.default(document.getElementById('stage')));

    // arrow keys step through the week
    addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        location.search = '?day=' + ((idx + (e.key === 'ArrowRight' ? 1 : 6)) % 7);
      }
    });
  </script>
</body>
</html>
